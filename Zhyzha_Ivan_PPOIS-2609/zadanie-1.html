
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Использование веб-форм на сайте</title>
    <link rel="stylesheet" href="css/style1.css">
</head>
<body>
    <header class="page-header">
        <h1>Форма регистрации на сайте</h1>
    </header>

    <main class="page">
        <h2>Добро пожаловать на наш сайт!</h2>
        <p class="intro">Для регистрации введите свои данные:</p>

        <form action="/signup" method="post">
            <fieldset class="account-info">
                <legend>Регистрационные данные</legend>

                <div class="form-fields">
                    <div class="form-field">
                        <label for="first-name">Имя</label>
                        <input id="first-name" name="first_name"
                               type="text" placeholder="Иван" required>
                    </div>

                    <div class="form-field">
                        <label for="last-name">Фамилия</label>
                        <input id="last-name" name="last_name"
                               type="text" placeholder="Иванов" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input id="email" name="email"
                               type="email" placeholder="example@mail.by"
                               pattern="[^@\s]+@[^@\s]+\.[^@\s]+" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Телефон</label>
                        <input id="phone" name="phone"
                               type="tel"
                               placeholder="+375(29)111-11-11"
                               pattern="\+375\([0-9]{2}\)[0-9]{3}-[0-9]{2}-[0-9]{2}"
                               required>
                    </div>

                    <div class="form-field">
                        <label for="country">Страна</label>
                        <select id="country" name="country" required>
                            <option value="" disabled>Выберите страну</option>
                            <option value="by" selected>Беларусь</option>
                            <option value="ru">Россия</option>
                            <option value="ua">Украина</option>
                            <option value="pl">Польша</option>
                            <option value="lt">Литва</option>
                            <option value="lv">Латвия</option>
                            <option value="ee">Эстония</option>
                            <option value="us">США</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="password">Пароль</label>
                        <input id="password" name="password"
                               type="password" minlength="8"
                               placeholder="Мин. 8 символов"
                               autocomplete="new-password" required>
                    </div>

                    <div class="form-field">
                        <label for="password-confirm">Подтвердите пароль</label>
                        <input id="password-confirm" name="password_confirm"
                               type="password" minlength="8"
                               placeholder="Повторите пароль"
                               autocomplete="new-password" required>
                    </div>
                </div>
            </fieldset>

            <div class="account-action">
                <div class="consent">
                    <input id="consent-rules" name="consent_rules"
                           type="checkbox" required>
                    <label for="consent-rules">
                        Отметьте для подтверждения согласия
                        <a href="#">с правилами использования услуги</a>
                    </label>
                </div>

                <div class="consent">
                    <input id="consent-data" name="consent_data"
                           type="checkbox" required>
                    <label for="consent-data">
                        Отметьте для согласия на обработку персональных данных
                        в соответствии с
                        <a href="#">Соглашением об обработке персональных данных</a>
                    </label>
                </div>

                <button class="btn" type="submit">
                    Зарегистрироваться
                </button>
            </div>
        </form>
    </main>

    <footer class="foot">
        © 2026, Официальный сайт Жижа Ивана Романовича, студент группы ППОИС-2609
    </footer>
</body>
</html>
